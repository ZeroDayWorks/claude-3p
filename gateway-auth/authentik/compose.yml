---
# Authentik OIDC deployment for Claude Desktop as an External IdP.
# Modeled on the official Authentik docker-compose.yml.
# Version pin: 2025.10.0 (do NOT use "latest").
# Postgres: 16-alpine. Redis: 7-alpine.
#
# Services:
#   db      - PostgreSQL (internal only)
#   redis   - Redis cache/broker (internal only)
#   server  - Authentik web/API (reachable only via reverse proxy)
#   worker  - Authentik background worker
#
# Named volumes: database, redis, media, custom-templates, certs
# Blueprints are bind-mounted read-only from ./blueprints for GitOps-style
# management.

x-authentik-env: &authentik-env
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: db
  AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?PG_PASS must be set - run scripts/generate-secrets.sh}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY must be set}
  AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
  AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
  AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
  AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
  AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
  AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
  AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
  AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@company.com}
  AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
  AUTHENTIK_DISABLE_UPDATE_CHECK: "false"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  AUTHENTIK_AVATARS: ${AUTHENTIK_AVATARS:-initials}
  AUTHENTIK_COOKIE_DOMAIN: ${AUTH_DOMAIN:-}
  TZ: UTC

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS must be set}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
      TZ: UTC
    networks:
      - internal
    # No ports: block - DB must never be reachable from host in production.

  redis:
    image: docker.io/library/redis:7-alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis:/data
    environment:
      TZ: UTC
    networks:
      - internal
    # No ports: block - Redis must never be reachable from host.

  server:
    image: ghcr.io/goauthentik/server:2025.10.0
    restart: unless-stopped
    command: server
    environment:
      <<: *authentik-env
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
      - ./certs:/certs
      - ./blueprints:/blueprints/custom:ro
    # Server internal HTTP port 9000 (and HTTPS 9443) are only reachable
    # via the internal network. The reverse proxy is the only ingress.
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - authentik-server

  worker:
    image: ghcr.io/goauthentik/server:2025.10.0
    restart: unless-stopped
    command: worker
    environment:
      <<: *authentik-env
    # The worker uses the docker socket for outposts management. On Linux
    # hosts you may add /var/run/docker.sock:/var/run/docker.sock:ro here.
    # Omitted by default so this file is portable to Windows/Podman.
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
      - ./certs:/certs
      - ./blueprints:/blueprints/custom:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  database:
    driver: local
    name: gateway-auth_database
  redis:
    driver: local
    name: gateway-auth_redis
  media:
    driver: local
  custom-templates:
    driver: local
  certs:
    driver: local

networks:
  internal:
    driver: bridge
    # Not marked internal:true because server needs egress for image pulls,
    # email SMTP, external IdP metadata, etc. All service-to-service traffic
    # stays on this bridge; the DB and Redis have no host port bindings.
