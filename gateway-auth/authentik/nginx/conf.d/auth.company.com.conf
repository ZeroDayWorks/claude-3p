# Reverse proxy for Authentik.
#
# TLS material paths come from environment variables at deploy time:
#   TLS_CERT_PATH -> ssl_certificate
#   TLS_KEY_PATH  -> ssl_certificate_key
# The tokens ${TLS_CERT_PATH} / ${TLS_KEY_PATH} are substituted with envsubst
# in the nginx entrypoint or CI pipeline (see docs/installation.md).

# HTTP -> HTTPS redirect.
server {
    listen      80;
    listen      [::]:80;
    server_name auth.company.com;

    # Allow ACME http-01 challenges to pass through without redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS vhost.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name auth.company.com;

    ssl_certificate     ${TLS_CERT_PATH};
    ssl_certificate_key ${TLS_KEY_PATH};

    # OCSP stapling (optional; requires a trust chain in ssl_certificate).
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout     5s;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    # HSTS - 1 year, include subdomains. Only enable once you are sure
    # the domain will always be HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    # Authentik's UI uses same-origin frames for some flows (e.g. embedded
    # confirmation). DENY breaks those; SAMEORIGIN is the safe choice.
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    # Do NOT set a global CSP here; Authentik ships its own per-response CSP.

    # ------------------------------------------------------------------
    # Body size + timeouts
    # ------------------------------------------------------------------
    client_max_body_size 100M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ------------------------------------------------------------------
    # Common proxy headers
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;

    # ------------------------------------------------------------------
    # WebSocket for /ws/ (Authentik uses it for background events + outposts)
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://authentik-server:9000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # long-lived
    }

    # ------------------------------------------------------------------
    # Rate limit sensitive endpoints
    # ------------------------------------------------------------------
    location /api/ {
        limit_req  zone=api_zone burst=60 nodelay;
        proxy_pass http://authentik-server:9000;
    }

    location /-/user/authenticate/ {
        limit_req  zone=auth_zone burst=10 nodelay;
        proxy_pass http://authentik-server:9000;
    }

    # ------------------------------------------------------------------
    # Everything else
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://authentik-server:9000;
    }
}
