name: cowork-otel-poc

services:
  loki:
    image: grafana/loki:3.7.0
    container_name: cowork-poc-loki
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - cowork-observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: cowork-poc-otel
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_BIND_ADDRESS:-0.0.0.0}:${OTEL_HTTP_PORT:-24318}:4318"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - cowork-observability

  grafana:
    image: grafana/grafana:13.1.3
    container_name: cowork-poc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-cowork-poc}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cowork-overview.json
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-23000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - cowork-observability

networks:
  cowork-observability:
    name: cowork-poc-observability

volumes:
  loki-data:
  grafana-data:
